<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ファイルボックス</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<meta name="apple-mobile-web-app-title" content="ファイルBOX">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#d4dce4;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

header{
  position:relative;
  background-color:#0e72dc;
  background-repeat:repeat-x;
  background-size:auto 100%;
  height:58px;min-height:58px;padding:0 14px 0 310px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:10;overflow:hidden
}
.band-img{
  position:absolute;left:0;top:0;height:58px;width:auto;pointer-events:none;z-index:0;
  clip-path:inset(0 3px 0 0);
}
.hl,.hr{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:100%}

.btn-r{
  background:linear-gradient(180deg,#ff9a76 0%,#f5623d 45%,#e03d1f 55%,#b8240b 100%);
  border:1px solid #801504;border-radius:6px;color:#fff;font-size:11px;font-weight:bold;
  line-height:1.15;padding:5px 10px;min-width:80px;white-space:nowrap;cursor:pointer;
  text-shadow:0 1px 1px rgba(0,0,0,.45);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),0 2px 3px rgba(0,0,0,.3)
}
.btn-r:active{transform:translateY(1px);background:linear-gradient(180deg,#e03d1f,#b8240b)}
.s-info{color:#fff;font-size:12px;line-height:1.25;margin-left:4px;white-space:nowrap;text-shadow:1px 1px 1px rgba(0,0,0,.35)}

.stat{display:flex;align-items:center;gap:6px;color:#fff;font-size:10px;font-weight:bold;line-height:1.1;text-align:center;white-space:nowrap;text-shadow:1px 1px 1px rgba(0,0,0,.4)}
.cloud-img{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.online-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.online-img{height:17px;width:auto;object-fit:contain;display:block}

.inf-i{width:26px;height:26px;background:radial-gradient(circle at 35% 35%,#70c4ff,#1e88e5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:serif;font-style:italic;font-size:16px;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);flex-shrink:0}
.img-btn{cursor:pointer;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.img-btn:active{transform:scale(.95)}
.btn-sq-img{height:40px;width:40px;object-fit:contain}

.main{display:flex;flex:1;overflow:hidden}
.side{width:300px;background:#e4e9ef;border-right:2px solid #9daab8;overflow-y:auto;padding:0}
.t-row{
  display:flex;align-items:center;position:relative;min-height:60px;
  border-bottom:1px solid #b8c2ce;padding:8px 10px 8px 14px;cursor:pointer;background:#e8edf2
}
.t-row.act{background:#d4e4f7;font-weight:bold}
.t-ico{
  width:52px;height:40px;flex-shrink:0;margin-right:12px;
  background:url("./folder.png") no-repeat center / 100% 100%
}
.t-lbl{font-size:16px;color:#222;line-height:1.3;word-break:break-word;flex:1}

.cont{flex:1;background:linear-gradient(180deg,#dbe2ea,#cfd8e2);padding:24px 28px;overflow-y:auto;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:26px 20px}
.g-item{display:flex;flex-direction:column;align-items:flex-start;cursor:pointer}
.i-wrap{width:76px;height:68px;position:relative;margin-bottom:6px}
.ico-dir{width:72px;height:56px;background:url("./folder.png") no-repeat left center / 100% 100%}
.ico-pdf{width:64px;height:64px;background:url("./pdf_64.png") no-repeat left center / contain}
.i-tit{font-size:12px;color:#222;width:100%;line-height:1.3;word-break:break-all;text-align:left}

.empty-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#556;font-size:14px;line-height:1.8}

.dl-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  align-items:center;justify-content:center;background:transparent
}
.dl-box{
  width:310px;min-height:200px;background:#f0f2f5;
  border:1px solid #8c96a0;box-shadow:0 4px 14px rgba(0,0,0,.28);
  padding:28px 24px 24px;display:flex;flex-direction:column;justify-content:space-between
}
.dl-txt{font-size:15px;color:#222;margin-bottom:18px;text-align:left}
.dl-bar-wrap{
  width:100%;height:18px;background:#e6e6e6;border:1px solid #999;overflow:hidden;margin-bottom:24px
}
.dl-bar-fill{
  height:100%;width:0%;background:#2eb82e;
  transition:width .18s linear
}
.dl-cancel{
  align-self:center;min-width:120px;padding:7px 18px;font-size:14px;color:#222;
  background:#e4e6e9;border:1px solid #888;border-radius:2px;cursor:pointer
}
.dl-cancel:active{background:#ccc}
</style>
</head>
<body>
<header id="hdr">
  <img src="./ファイルBOX_帯.png" id="bandImg" class="band-img" alt="">
  <div class="hl">
    <input type="file" id="fi" webkitdirectory directory multiple hidden>
    <button class="btn-r" onclick="document.getElementById('fi').click()">まとめて<br>ダウンロード</button>
    <button class="btn-r" onclick="clr()">まとめて<br>クリア</button>
    <div class="s-info" id="si">校舎:長久手本部校<br>中１</div>
  </div>
  <div class="hr">
    <div class="stat">
      <img src="./cloud_dl.png" class="cloud-img" alt="">
      <div class="online-box">
        <img src="./online_text.png" class="online-img" alt="オンライン">
        <span>（一般）</span>
      </div>
    </div>
    <div class="inf-i">i</div>
    <button class="img-btn" onclick="doUpdate()"><img src="./update.png" class="btn-sq-img" alt="更新"></button>
    <button class="img-btn" onclick="closeTab()"><img src="./btnClose.png" class="btn-sq-img" alt="閉じる"></button>
  </div>
</header>
<div class="main">
  <div class="side" id="tr"></div>
  <div class="cont">
    <div class="grid" id="gr"></div>
    <div class="empty-msg" id="emp">左上の<strong>「まとめてダウンロード」</strong>を押して<br>iPad内のフォルダを選択してください</div>
  </div>
</div>

<div class="dl-overlay" id="dlOv">
  <div class="dl-box">
    <div class="dl-txt">ファイルダウンロード中...</div>
    <div class="dl-bar-wrap"><div class="dl-bar-fill" id="dlBar"></div></div>
    <button class="dl-cancel" onclick="hideDl()">キャンセル</button>
  </div>
</div>

<script>
(function(){
  const img=document.getElementById('bandImg');
  function syncBand(){
    try{
      const c=document.createElement('canvas');
      c.width=1;c.height=img.naturalHeight;
      const ctx=c.getContext('2d');
      const x=Math.max(0,img.naturalWidth-6);
      ctx.drawImage(img,x,0,1,img.naturalHeight,0,0,1,img.naturalHeight);
      document.getElementById('hdr').style.backgroundImage=`url(${c.toDataURL()})`;
    }catch(e){}
  }
  if(img.complete&&img.naturalWidth)syncBand();
  else img.onload=syncBand;
})();

let dlTimer=null;
function doUpdate(){
  const ov=document.getElementById('dlOv');
  const bar=document.getElementById('dlBar');
  clearTimeout(dlTimer);
  bar.style.transition='none';
  bar.style.width='15%';
  ov.style.display='flex';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      bar.style.transition='width .18s linear';
      bar.style.width='85%';
    });
  });
  dlTimer=setTimeout(()=>{
    hideDl();
    renderGrid();
  },200);
}
function hideDl(){
  clearTimeout(dlTimer);
  document.getElementById('dlOv').style.display='none';
}

/* 仕様：フォルダ移動時に5回に1回（20%）の確率で右側のフォルダ群だけが一瞬消える */
function triggerFlicker(){
  if(Math.random()<0.2){
    const gr=document.getElementById('gr');
    gr.style.visibility='hidden';
    setTimeout(()=>{gr.style.visibility='visible';},60);
  }
}

function sanaruSort(a,b){
  const rank=s=>{
    const c=s.charAt(0);
    if(c==='☆')return 0;
    if(c==='★')return 1;
    if(/[0-9A-Za-z]/.test(c))return 2;
    if(/[\u3041-\u3096\u30A1-\u30FC]/.test(c))return 3;
    return 4;
  };
  const ra=rank(a),rb=rank(b);
  if(ra!==rb)return ra-rb;
  return a.localeCompare(b,'ja');
}

let rt=null,cp=[];

function clr(){
  rt=null;cp=[];
  document.getElementById('fi').value='';
  document.getElementById('tr').innerHTML='';
  document.getElementById('gr').innerHTML='';
  document.getElementById('emp').style.display='block';
}

function closeTab(){
  window.open('about:blank','_self').close();
  window.close();
}

document.getElementById('fi').onchange=e=>{
  const fs=Array.from(e.target.files).filter(f=>!f.name.startsWith('.'));
  if(!fs.length)return;
  rt={c:{},f:[]};
  fs.forEach(f=>{
    const ps=f.webkitRelativePath.split('/');let n=rt;
    for(let i=0;i<ps.length-1;i++){if(!n.c[ps[i]])n.c[ps[i]]={c:{},f:[]};n=n.c[ps[i]];}
    n.f.push(f);
  });
  const ts=Object.keys(rt.c);cp=ts.length?[ts]:[];
  document.getElementById('emp').style.display='none';
  buildTree();
  renderGrid();
};

function buildTree(){
  if(!rt)return;
  const tr=document.getElementById('tr');
  const trFrag=document.createDocumentFragment();
  function wk(n,p,d){
    if(d>3)return;
    Object.keys(n.c).sort(sanaruSort).forEach(k=>{
      const ch=n.c[k];
      const nx=[...p,k];
      const r=document.createElement('div');
      r.className='t-row';
      r.dataset.path=JSON.stringify(nx);
      r.style.paddingLeft=(14+d*24)+'px';
      r.innerHTML=`<div class="t-ico"></div><div class="t-lbl">${k}</div>`;
      r.onclick=()=>{cp=nx;triggerFlicker();updateTreeActive();renderGrid();};
      trFrag.appendChild(r);
      wk(ch,nx,d+1);
    });
  }
  wk(rt,[],0);
  tr.replaceChildren(trFrag);
  updateTreeActive();
}

function updateTreeActive(){
  const curStr=JSON.stringify(cp);
  document.querySelectorAll('#tr .t-row').forEach(r=>{
    r.classList.toggle('act',r.dataset.path===curStr);
  });
}

function renderGrid(){
  if(!rt)return;
  let cn=rt;cp.forEach(p=>{if(cn)cn=cn.c[p];});if(!cn)return;
  const gr=document.getElementById('gr');
  const grFrag=document.createDocumentFragment();

  const items=[
    ...Object.keys(cn.c).map(k=>({type:'dir',name:k})),
    ...cn.f.map(f=>({type:'file',name:f.name,file:f}))
  ].sort((a,b)=>sanaruSort(a.name,b.name));

  items.forEach(it=>{
    const el=document.createElement('div');el.className='g-item';
    if(it.type==='dir'){
      el.innerHTML=`<div class="i-wrap ico-dir"></div><div class="i-tit">${it.name}</div>`;
      el.onclick=()=>{cp=[...cp,it.name];triggerFlicker();updateTreeActive();renderGrid();};
    }else{
      el.innerHTML=`<div class="i-wrap ico-pdf"></div><div class="i-tit">${it.name}</div>`;
      el.onclick=()=>{
        const url=URL.createObjectURL(it.file);
        window.open(url,'_blank');
      };
    }
    grFrag.appendChild(el);
  });
  gr.replaceChildren(grFrag);
}
</script>
</body>
</html>
