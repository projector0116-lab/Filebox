<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ファイルBOX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#d4dce4;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

/* 上の帯：画像と同じ色の縦ラインを右端まで100%引き伸ばして継ぎ目をゼロにする */
header{
  position:relative;
  background-color:#0e72dc;
  background-repeat:repeat-x;
  background-size:auto 100%;
  height:60px;padding:0 14px 0 320px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:10
}
.band-img{
  position:absolute;left:0;top:0;height:100%;width:auto;pointer-events:none;z-index:0;
}
.hl,.hr{position:relative;z-index:1;display:flex;align-items:center;gap:10px}

.btn-r{
  background:linear-gradient(180deg,#ff9a76 0%,#f5623d 45%,#e03d1f 55%,#b8240b 100%);
  border:1px solid #801504;border-radius:6px;color:#fff;font-size:11px;font-weight:bold;
  line-height:1.15;padding:6px 10px;min-width:82px;white-space:nowrap;cursor:pointer;
  text-shadow:0 1px 1px rgba(0,0,0,.45);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),0 2px 3px rgba(0,0,0,.3)
}
.btn-r:active{transform:translateY(1px);background:linear-gradient(180deg,#e03d1f,#b8240b)}
.s-info{color:#fff;font-size:12px;line-height:1.25;margin-left:4px;white-space:nowrap;text-shadow:1px 1px 1px rgba(0,0,0,.35)}

.stat{display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:bold;line-height:1.15;text-align:center;white-space:nowrap;text-shadow:1px 1px 1px rgba(0,0,0,.4)}
.arr{width:22px;height:22px;background:#0a4b99;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #75baff;font-size:12px;flex-shrink:0}
.inf-i{width:26px;height:26px;background:radial-gradient(circle at 35% 35%,#70c4ff,#1e88e5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:serif;font-style:italic;font-size:16px;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);flex-shrink:0}
.img-btn{cursor:pointer;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.img-btn:active{transform:scale(.95)}
.btn-sq-img{height:42px;width:42px;object-fit:contain}

.main{display:flex;flex:1;overflow:hidden}
.side{width:300px;background:#e4e9ef;border-right:2px solid #9daab8;overflow-y:auto;padding:0}
.t-row{
  display:flex;align-items:center;position:relative;min-height:58px;
  border-bottom:1px solid #b8c2ce;padding:6px 10px 6px 14px;cursor:pointer;background:#e8edf2
}
.t-row:hover{background:#f0f4f8}
.t-row.act{background:#d4e4f7;font-weight:bold}
.t-ico{width:52px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-right:10px}
.t-ico img{width:52px;height:40px;object-fit:fill}
.t-lbl{font-size:13px;color:#222;line-height:1.3;word-break:break-word;flex:1}

.cont{flex:1;background:linear-gradient(180deg,#dbe2ea,#cfd8e2);padding:24px 28px;overflow-y:auto;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:26px 20px}
.g-item{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.i-wrap{width:76px;height:68px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.i-wrap img.f-img{width:72px;height:56px;object-fit:fill}
.i-wrap img.p-img{width:64px;height:64px;object-fit:contain}
.i-tit{font-size:12px;color:#222;width:100%;line-height:1.3;word-break:break-all;text-align:center}

.empty-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#556;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<header id="hdr">
  <img src="./ファイルBOX_帯.png" id="bandImg" class="band-img" alt="">
  <div class="hl">
    <input type="file" id="fi" webkitdirectory directory multiple hidden>
    <button class="btn-r" onclick="document.getElementById('fi').click()">まとめて<br>ダウンロード</button>
    <button class="btn-r" onclick="clr()">まとめて<br>クリア</button>
    <div class="s-info" id="si">フォルダ未選択<br>iPadから選択</div>
  </div>
  <div class="hr">
    <div class="stat"><div class="arr">⬇</div><div>オンライン<br><span style="font-size:10px">（一般）</span></div></div>
    <div class="inf-i">i</div>
    <button class="img-btn" onclick="ren()"><img src="./update.png" class="btn-sq-img" alt="更新"></button>
    <button class="img-btn" onclick="closeTab()"><img src="./btnClose.png" class="btn-sq-img" alt="閉じる"></button>
  </div>
</header>
<div class="main">
  <div class="side" id="tr"></div>
  <div class="cont">
    <div class="grid" id="gr"></div>
    <div class="empty-msg" id="emp">左上の<strong>「まとめてダウンロード」</strong>を押して<br>iPad内のフォルダを選択してください</div>
  </div>
</div>
<script>
/* 帯画像の右端の色・グラデーションをそのまま抽出してヘッダー全体に延長 */
(function(){
  const img=document.getElementById('bandImg');
  function syncBand(){
    try{
      const c=document.createElement('canvas');
      c.width=1;c.height=img.naturalHeight;
      const ctx=c.getContext('2d');
      // 枠線の内側の列（右端から少し内側）をコピーして繰り返す
      const x=Math.max(0,img.naturalWidth-6);
      ctx.drawImage(img,x,0,1,img.naturalHeight,0,0,1,img.naturalHeight);
      document.getElementById('hdr').style.backgroundImage=`url(${c.toDataURL()})`;
    }catch(e){}
  }
  if(img.complete&&img.naturalWidth)syncBand();
  else img.onload=syncBand;
})();

let rt=null,cp=[];

function clr(){
  rt=null;cp=[];
  document.getElementById('fi').value='';
  document.getElementById('tr').innerHTML='';
  document.getElementById('gr').innerHTML='';
  document.getElementById('emp').style.display='block';
  document.getElementById('si').innerHTML='フォルダ未選択<br>iPadから選択';
}

function closeTab(){
  window.close();
  setTimeout(()=>{
    document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#222;color:#fff;font-family:sans-serif;font-size:16px;">タブを閉じて終了してください</div>';
  },150);
}

document.getElementById('fi').onchange=e=>{
  const fs=Array.from(e.target.files).filter(f=>!f.name.startsWith('.'));
  if(!fs.length)return;
  rt={c:{},f:[]};
  fs.forEach(f=>{
    const ps=f.webkitRelativePath.split('/');let n=rt;
    for(let i=0;i<ps.length-1;i++){if(!n.c[ps[i]])n.c[ps[i]]={c:{},f:[]};n=n.c[ps[i]];}
    n.f.push(f);
  });
  const ts=Object.keys(rt.c);cp=ts.length?[ts]:[];
  document.getElementById('emp').style.display='none';
  document.getElementById('si').innerHTML=`フォルダ:${ts||''}<br>${fs.length}件`;
  ren();
};

function ren(){
  if(!rt)return;
  const tr=document.getElementById('tr');tr.innerHTML='';
  function wk(n,p,d){
    if(d>3)return;
    Object.keys(n.c).sort().forEach(k=>{
      const ch=n.c[k];
      const nx=[...p,k],ac=JSON.stringify(nx)===JSON.stringify(cp);
      const r=document.createElement('div');r.className='t-row'+(ac?' act':'');
      r.style.paddingLeft=(14+d*24)+'px';
      r.innerHTML=`<div class="t-ico"><img src="./folder.png" alt=""></div><div class="t-lbl">${k}</div>`;
      r.onclick=()=>{cp=nx;ren();};tr.appendChild(r);wk(ch,nx,d+1);
    });
  }
  wk(rt,[],0);

  let cn=rt;cp.forEach(p=>{if(cn)cn=cn.c[p];});if(!cn)return;
  const gr=document.getElementById('gr');gr.innerHTML='';

  Object.keys(cn.c).sort().forEach(k=>{
    const el=document.createElement('div');el.className='g-item';
    el.innerHTML=`<div class="i-wrap"><img src="./folder.png" class="f-img" alt=""></div><div class="i-tit">${k}</div>`;
    el.onclick=()=>{cp=[...cp,k];ren();};
    gr.appendChild(el);
  });

  cn.f.sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(f=>{
    const el=document.createElement('div');el.className='g-item';
    el.innerHTML=`<div class="i-wrap"><img src="./pdf_64.png" class="p-img" alt=""></div><div class="i-tit">${f.name}</div>`;
    el.onclick=()=>{
      const url=URL.createObjectURL(f);
      window.open(url,'_blank');
    };
    gr.appendChild(el);
  });
}
</script>
</body>
</html>
